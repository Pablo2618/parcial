<!DOCTYPE html>
<html>

<head>
    <title>Formulario parcial</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Registro</h1>
        <form acion="#">
            <div class="columnas">
                <div class="fila">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required />
                </div>

                <div class="fila">
                    <label for="nombre">Usuario:</label>
                    <input type="text" id="nombre" name="nombre" required />
                </div>

                <div class="columnas">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required />
                </div>

                <div class="fila">
                    <label for="numero">Numero:</label>
                    <input type="tel" id="numero" name="numero" required />
                </div>

                <div class="fila">
                    <!--para la contraseña se aplica el lookahead en el pattern para la validacion-->
                    <label for="contraseña">Contraseña</label>
                    <!--se valida que haya una letra mayuscula, un numero, una letra minuscula y el minimo de 8 caracteres-->
                    <input type="password" id="password" name="password" required minlength="8"
                        pattern="(?=.*[A-Z])(?=.*\d)(?=.*[a-z]).{8,}"
                        title="Mínimo 8 caracteres, al menos una mayúscula y un número">
                </div>

                <div class="fila">
                    <label for="confirmar">Confirme su contraseña</label>
                    <input type="password" id="confirmar" name="confirmar" required>
                </div>

                <fieldset>
                    <legend>Gender</legend>
                    <div class="options">
                        <label><input type="radio" name="gender" value="male"> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="none"> Prefer not to say</label>
                    </div>
                </fieldset>

                <input type="submit" value="Enviar" />
            </div>
        </form>
    </div>
</body>

</html>
